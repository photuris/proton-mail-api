[package]
name = "proton-mail-api"
version = "0.3.0"
edition = "2024"
description = "Unofficial pure-Rust client for the Proton Mail API (SRP login, key unlock, mail read and triage)"
license = "MIT"

[dependencies]
base64 = "0.22"
bcrypt = "0.19"
mail-parser = "0.11"
num-bigint = "0.4"
num-traits = "0.2"
pgp = "0.21"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = { version = "1", features = ["derive", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
